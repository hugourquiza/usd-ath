  body { margin: 0; background: #07070c; }

<template id="v-moderno" data-title="¿Está el dólar en ATH en Argentina?">
<style>
  :root {
    --bg: #07070c; --card: rgba(255, 255, 255, 0.04); --card-hi: rgba(255, 255, 255, 0.07); --border: rgba(255, 255, 255, 0.08);
    --text: #f4f4f8; --muted: #8b8b9e; --a: #7c5cff; --b: #22d3ee; --hot: #ff4d8d; --ok: #34d399;
    --glow: rgba(34, 211, 238, 0.35);
  }
  body.is-ath { --glow: rgba(255, 77, 141, 0.45); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.5 "Space Grotesk", system-ui, sans-serif;
    background:
      radial-gradient(60vw 40vw at 85% -10%, rgba(124, 92, 255, 0.28), transparent 60%),
      radial-gradient(50vw 40vw at -10% 30%, rgba(34, 211, 238, 0.16), transparent 60%),
      var(--bg);
  }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
  .logo { font-weight: 700; letter-spacing: -0.02em; }
  .logo span { background: linear-gradient(90deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .live { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 12px var(--ok); }
  .live.tick::before { animation: ping 0.8s ease-out; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); } 100% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); } }

  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--card); }
  .is-ath .badge { border-color: rgba(255, 77, 141, 0.5); color: var(--hot); box-shadow: 0 0 24px rgba(255, 77, 141, 0.3); }

  /* Precio: cada dígito es una tira 0–9 que rueda hasta el valor nuevo. */
  .price-row { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin: 20px 0 12px; }
  .price { display: flex; align-items: baseline; font-weight: 700; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums;
    filter: drop-shadow(0 0 28px var(--glow)); transition: color 0.6s; }
  .price .cur { font-size: clamp(32px, 7vw, 64px); color: var(--muted); margin-right: 0.08em; align-self: flex-start; margin-top: 0.12em; letter-spacing: 0; }
  .price .int { font-size: clamp(64px, 15vw, 136px); }
  .price .dec { font-size: clamp(32px, 7vw, 64px); color: var(--b); }
  .is-ath .price .dec { color: var(--hot); }
  .price.up { color: var(--ok); } .price.down { color: var(--hot); }
  .price.up .dec, .price.down .dec { color: inherit; }
  .odo { display: inline-flex; }
  .digit { display: inline-block; height: 1em; overflow: hidden; }
  .digit .strip { display: flex; flex-direction: column; transition: transform 0.7s cubic-bezier(0.2, 0.9, 0.2, 1); }
  .digit .strip span { height: 1em; }
  .change { padding: 6px 12px; border-radius: 10px; font-weight: 500; font-variant-numeric: tabular-nums; background: var(--card); border: 1px solid var(--border); margin-bottom: 0.9em; }
  .change.pos { color: var(--ok); } .change.neg { color: var(--hot); }
  .message { color: var(--muted); font-size: 18px; max-width: 620px; margin: 0; }

  .chart-card { margin: 40px 0 12px; padding: 20px 12px 8px; background: var(--card); border: 1px solid var(--border); border-radius: 24px; backdrop-filter: blur(12px); }
  .chart-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 8px 8px; }
  .chart-head h2 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 0; }
  .ranges { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border); }
  .ranges button { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 6px 12px; border-radius: 9px; cursor: pointer; }
  .ranges button:hover { color: var(--text); }
  .ranges button[aria-pressed="true"] { color: var(--text); background: var(--card-hi); box-shadow: inset 0 0 0 1px var(--border); }
  .ranges button:focus-visible { outline: 2px solid var(--b); outline-offset: 2px; }
  #chart { min-height: 200px; transition: opacity 0.2s; touch-action: pan-y; }
  #chart.loading { opacity: 0.35; }
  .usdt-chart { cursor: crosshair; }
  .usdt-chart .grid { stroke: var(--border); }
  .usdt-chart .tick { fill: var(--muted); font: 11px "Space Grotesk", sans-serif; }
  .usdt-chart .line { stroke: var(--b); stroke-width: 2.5; filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.6)); }
  .usdt-chart .area { fill: url(#usdt-area); }
  .usdt-chart .stop-top { stop-color: var(--a); stop-opacity: 0.45; }
  .usdt-chart .stop-bottom { stop-color: var(--a); stop-opacity: 0; }
  .usdt-chart .dot { fill: #fff; filter: drop-shadow(0 0 6px var(--b)); }
  .usdt-chart .ath-line { stroke: var(--hot); }
  .usdt-chart .ath-label { fill: var(--hot); font: 500 11px "Space Grotesk", sans-serif; }
  .usdt-chart .hover-line { stroke: rgba(255, 255, 255, 0.35); stroke-dasharray: 3 3; opacity: 0; }
  .usdt-chart .hover-dot { fill: var(--bg); stroke: var(--b); stroke-width: 2.5; opacity: 0; }
  .chart-tip { position: absolute; transform: translate(-50%, calc(-100% - 14px)); padding: 8px 12px; border-radius: 12px; pointer-events: none; white-space: nowrap;
    background: rgba(20, 20, 32, 0.92); border: 1px solid var(--border); font-size: 13px; opacity: 0; transition: opacity 0.15s; }
  .chart-tip b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .chart-tip span { color: var(--muted); }
  .hovering .hover-line, .hovering .hover-dot, .hovering .chart-tip { opacity: 1; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px 18px; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat b { display: block; font-size: 22px; font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; }
  footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
  @media (prefers-reduced-motion: reduce) { .digit .strip, .price, #chart { transition: none; } .live.tick::before { animation: none; } }
</style>
<main>
  <nav>
    <div class="logo">usdt<span>/ath</span></div>
    <div class="live" id="updated">Conectando…</div>
  </nav>

  <div class="badge" id="badge">USDT/ARS en Binance</div>
  <div class="price-row">
    <div class="price" id="price" aria-live="polite">
      <span class="cur">$</span><span class="int odo" id="price-int">—</span><span class="dec odo" id="price-dec"></span>
    </div>
    <div class="change" id="change" hidden></div>
  </div>
  <p class="message" id="message">Consultando Binance…</p>

  <section class="chart-card">
    <div class="chart-head">
      <h2 id="chart-title">Cotización</h2>
      <div class="ranges" role="group" aria-label="Período del gráfico" id="ranges"></div>
    </div>
    <div id="chart" class="loading"></div>
  </section>

  <div class="stats">
    <div class="stat"><span>All time high</span><b id="ath">—</b></div>
    <div class="stat"><span>Fecha del ATH</span><b id="ath-date">—</b></div>
    <div class="stat"><span>Distancia al ATH</span><b id="diff">—</b></div>
    <div class="stat"><span id="range-label">Mín. y máx. del período</span><b id="range-minmax">—</b></div>
  </div>
  <footer>API pública de Binance · precio cada 10 s, gráfico cada 5 min</footer>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const pct = (v) => (v > 0 ? "+" : "") + v.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
  const RANGES = [
    { key: "24h", label: "24 h", title: "Últimas 24 horas", days: 1, interval: "15m" },
    { key: "7d", label: "7 d", title: "Últimos 7 días", days: 7, interval: "2h" },
    { key: "30d", label: "30 d", title: "Últimos 30 días", days: 30, interval: "8h" },
    { key: "1a", label: "1 año", title: "Último año", days: 365, interval: "1d" },
    { key: "todo", label: "Todo", title: "Desde abril de 2023", days: null, interval: "3d" },
  ];
  const tipTime = new Intl.DateTimeFormat("es-AR", {
    timeZone: "America/Argentina/Buenos_Aires", day: "2-digit", month: "2-digit", year: "numeric",
    hour: "2-digit", minute: "2-digit", hour12: false,
  });

  let range = RANGES[1], points = null, ath = null, lastPrice = null, lastChangeFetch = 0;
  try { range = RANGES.find((r) => r.key === localStorage.getItem("usdt-range")) || range; } catch (e) {}

  // --- Precio con odómetro ---
  function setOdometer(el, text) {
    if (el.dataset.text?.length !== text.length || el.dataset.shape !== text.replace(/\d/g, "0")) {
      // Cambió la forma (otra cantidad de dígitos): se reconstruye.
      el.innerHTML = [...text].map((ch) => /\d/.test(ch)
        ? `<span class="digit"><span class="strip">${"0123456789".split("").map((d) => `<span>${d}</span>`).join("")}</span></span>`
        : `<span>${ch}</span>`).join("");
      el.dataset.shape = text.replace(/\d/g, "0");
    }
    el.dataset.text = text;
    const strips = el.querySelectorAll(".strip");
    [...text].filter((ch) => /\d/.test(ch)).forEach((d, n) => { strips[n].style.transform = `translateY(-${d}em)`; });
  }
  function setPrice(value) {
    const [int, dec] = USDT.formatArs(value).slice(1).split(",");
    setOdometer($("price-int"), int);
    setOdometer($("price-dec"), "," + dec);
    if (lastPrice != null && value !== lastPrice) {
      const el = $("price");
      el.classList.remove("up", "down");
      void el.offsetWidth; // reinicia la transición
      el.classList.add(value > lastPrice ? "up" : "down");
      setTimeout(() => el.classList.remove("up", "down"), 1200);
    }
    lastPrice = value;
  }

  // --- Gráfico ---
  function renderRanges() {
    $("ranges").innerHTML = RANGES.map((r) =>
      `<button type="button" data-key="${r.key}" aria-pressed="${r === range}">${r.label}</button>`).join("");
  }
  function drawChart() {
    if (!points || !ath) return;
    const chart = $("chart");
    const width = Math.max(320, chart.clientWidth);
    const opts = { width, height: width < 600 ? 240 : 300, ath: ath.price };
    chart.innerHTML = USDT.svgChart(points, opts);
    USDT.attachHover(chart, points, opts, (p) =>
      `<b>${USDT.formatArs(p.close)}</b><span>${range.days != null && range.days <= 30 ? tipTime.format(p.time) : USDT.formatDate(p.time)}</span>`);
    const closes = points.map((p) => p.close);
    $("range-label").textContent = `Mín. y máx. (${range.label})`;
    $("range-minmax").textContent =
      `${Math.round(Math.min(...closes)).toLocaleString("es-AR")} – ${Math.round(Math.max(...closes)).toLocaleString("es-AR")}`;
  }
  async function loadChart() {
    const wanted = range;
    $("chart").classList.add("loading");
    $("chart-title").textContent = `${wanted.title} · velas de ${wanted.interval}`;
    try {
      const data = await USDT.getCloses(wanted.days, wanted.interval);
      if (wanted !== range) return; // el usuario ya eligió otro período
      points = data;
      drawChart();
    } catch (exc) {
      $("chart-title").textContent = `No se pudo cargar el gráfico (${exc.message}).`;
    }
    $("chart").classList.remove("loading");
  }
  $("ranges").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    range = RANGES.find((r) => r.key === btn.dataset.key);
    try { localStorage.setItem("usdt-range", range.key); } catch (e) {}
    renderRanges();
    loadChart();
  });
  let resizeTimer;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawChart, 150); });
  setInterval(loadChart, 5 * 60 * 1000);
  renderRanges();
  loadChart();

  // --- Variación 24 h (como mucho una consulta por minuto) ---
  async function refreshChange() {
    if (Date.now() - lastChangeFetch < 60000) return;
    lastChangeFetch = Date.now();
    try {
      const change = await USDT.get24hChange();
      $("change").hidden = false;
      $("change").textContent = `${pct(change)} en 24 h`;
      $("change").className = "change " + (change >= 0 ? "pos" : "neg");
    } catch (exc) { /* se reintenta en la próxima actualización */ }
  }

  USDT.start(({ current, ath: a, recent, message }) => {
    const firstAth = !ath;
    ath = a;
    USDT.stayOnVersion("moderno", USDT.devaluometro(current.price, ath.price, recent));
    setPrice(current.price);
    document.body.classList.toggle("is-ath", message.isAth);
    $("message").textContent = message.text;
    $("badge").textContent = message.isAth ? "🔥 Nuevo all time high" : "USDT/ARS en Binance";
    $("ath").textContent = USDT.formatArs(ath.price);
    $("ath-date").textContent = USDT.formatDate(ath.time);
    $("diff").textContent = pct((current.price / ath.price - 1) * 100);
    const live = $("updated");
    live.textContent = `En vivo · ${USDT.formatTime(current.time)}`;
    live.classList.remove("tick"); void live.offsetWidth; live.classList.add("tick");
    if (firstAth) drawChart(); // el gráfico necesita el ATH para la línea punteada
    refreshChange();
  }, (exc) => {
    $("message").textContent = `No se pudo consultar la API de Binance (${exc.message}). Recargá la página para reintentar.`;
  });
</script>
</template>

<template id="v-fuego" data-title="¿Está el dólar en ATH en Argentina?">
<style>
  :root {
    --black: #0a0000; --blood: #2b0302; --red: #ff1f0f; --orange: #ff6a00; --yellow: #ffd23f; --ash: #d9a79f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--black); color: #fff; font: 600 18px/1.45 "Barlow Condensed", system-ui, sans-serif; overflow-x: hidden; }

  .hero { position: relative; display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 48px 16px 110px; background: radial-gradient(80% 60% at 50% 100%, #5a0700 0%, var(--blood) 45%, var(--black) 100%); overflow: hidden; }
  /* Cubre todo el hero: en all time high las llamas llegan hasta arriba. */
  #fire { position: absolute; left: 0; top: 0; bottom: -8px; /* esconde el borde que deja el blur */ width: 100%; height: calc(100% + 8px); z-index: 0; filter: blur(3px) saturate(1.3); mix-blend-mode: screen; }
  .hero > *:not(canvas) { position: relative; z-index: 1; }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 92px; z-index: 0; background: linear-gradient(transparent, var(--black)); }
  .kicker { margin: 0; font: 400 clamp(22px, 4vw, 36px)/1 "Anton", sans-serif; color: var(--yellow); letter-spacing: 0.04em; }
  .price {
    margin: 8px 0 0; font: 400 clamp(88px, 21vw, 260px)/0.92 "Anton", sans-serif; letter-spacing: 0.01em;
    background: linear-gradient(0deg, var(--red) 0%, var(--orange) 30%, var(--yellow) 50%, var(--orange) 70%, var(--red) 100%);
    background-size: 100% 300%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: burn 2.4s linear infinite; filter: drop-shadow(0 0 30px rgba(255, 60, 0, 0.55));
  }
  @keyframes burn { from { background-position: 0 0%; } to { background-position: 0 100%; } }
  .shake { animation: burn 2.4s linear infinite, shake 0.5s; }
  @keyframes shake { 20% { transform: translate(-6px, 2px) rotate(-1deg); } 40% { transform: translate(5px, -3px); } 60% { transform: translate(-4px, 1px) rotate(1deg); } 80% { transform: translate(3px, 0); } }
  .message { max-width: 34ch; margin: 18px 0 0; font-size: clamp(20px, 2.6vw, 26px); color: #ffe9e4; text-shadow: 0 2px 12px #000; }
  .gap { margin: 10px 0 0; font: 400 clamp(20px, 3vw, 28px)/1.1 "Anton", sans-serif; color: var(--yellow); text-shadow: 0 2px 12px #000; }

  /* Devaluómetro */
  .meter { width: min(560px, 100%); margin: 28px 0 0; }
  .meter-head { display: flex; justify-content: space-between; font-size: 17px; color: var(--ash); text-shadow: 0 1px 8px #000; }
  .meter-head b { font: 400 22px "Anton", sans-serif; color: #fff; }
  .meter-bar { height: 16px; margin-top: 6px; border-radius: 999px; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 80, 40, 0.5); overflow: hidden; }
  .meter-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--red), var(--orange), var(--yellow));
    box-shadow: 0 0 18px var(--orange); transition: width 1s cubic-bezier(0.2, 0.9, 0.2, 1); }
  .meter-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: 16px; color: #ffe9e4; text-shadow: 0 1px 6px #000, 0 0 2px #000; }

  .below { position: relative; z-index: 2; max-width: 1040px; margin: 0 auto; padding: 16px 16px 64px; }
  .below h2 { margin: 0 0 8px; font: 400 clamp(28px, 4vw, 40px)/1 "Anton", sans-serif; color: var(--red); letter-spacing: 0.01em; }
  .below h2 small { font: 600 17px "Barlow Condensed", sans-serif; color: var(--ash); margin-left: 10px; letter-spacing: 0; }
  #chart { margin: 0 -4px; touch-action: pan-y; }
  .usdt-chart { cursor: crosshair; }
  .usdt-chart .grid { stroke: rgba(255, 60, 30, 0.18); }
  .usdt-chart .tick { fill: var(--ash); font: 600 13px "Barlow Condensed", sans-serif; }
  .usdt-chart .line { stroke: var(--orange); stroke-width: 3; filter: drop-shadow(0 0 8px var(--red)); }
  .usdt-chart .area { fill: url(#usdt-area); }
  .usdt-chart .stop-top { stop-color: var(--red); stop-opacity: 0.55; }
  .usdt-chart .stop-bottom { stop-color: var(--red); stop-opacity: 0; }
  .usdt-chart .dot { fill: var(--yellow); filter: drop-shadow(0 0 8px var(--yellow)); }
  .usdt-chart .ath-line { stroke: var(--yellow); }
  .usdt-chart .ath-label { fill: var(--yellow); font: 400 14px "Anton", sans-serif; }
  .usdt-chart .hover-line { stroke: var(--yellow); stroke-dasharray: 3 3; opacity: 0; }
  .usdt-chart .hover-dot { fill: var(--black); stroke: var(--yellow); stroke-width: 3; opacity: 0; }
  .chart-tip { position: absolute; transform: translate(-50%, calc(-100% - 14px)); padding: 6px 12px; pointer-events: none; white-space: nowrap;
    background: var(--red); color: var(--black); border: 2px solid var(--yellow); font-size: 15px; opacity: 0; }
  .chart-tip b { display: block; font: 400 20px "Anton", sans-serif; }
  .hovering .hover-line, .hovering .hover-dot, .hovering .chart-tip { opacity: 1; }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 28px; border: 2px solid var(--red); }
  .facts div { padding: 14px 18px; }
  .facts div + div { border-left: 2px solid var(--red); }
  .facts dt { color: var(--ash); font-size: 16px; }
  .facts dd { margin: 0; font: 400 clamp(24px, 3.4vw, 34px)/1.15 "Anton", sans-serif; }
  @media (max-width: 640px) { .facts { grid-template-columns: 1fr; } .facts div + div { border-left: 0; border-top: 2px solid var(--red); } }
  footer { margin-top: 28px; color: var(--ash); font-size: 15px; }

  @media (prefers-reduced-motion: reduce) { .price, .shake { animation: none; } }
</style>
<section class="hero">
  <canvas id="fire" aria-hidden="true"></canvas>
  <p class="kicker">Arde el dólar cripto</p>
  <h1 class="price" id="price">$…</h1>

  <p class="gap" id="gap"></p>

    <div class="meter-head"><span>Devaluómetro</span><b id="meter-value">—</b></div>
    <div class="meter-bar"><div class="meter-fill" id="meter-fill"></div></div>
    <div class="meter-foot"><span id="meter-low"></span><span id="meter-high"></span></div>
  </div>
</section>

<section class="below">
  <h2>La semana en llamas <small id="chart-sub"></small></h2>
  <div id="chart"></div>
  <dl class="facts">
    <div><dt>Récord histórico</dt><dd id="ath">—</dd></div>
    <div><dt>Fecha del récord</dt><dd id="ath-date">—</dd></div>
    <div><dt>Última actualización</dt><dd id="updated">—</dd></div>
  </dl>
  <footer>Datos públicos de Binance, precio cada 10 segundos. El devaluómetro mide cuánto subió el dólar desde el mínimo de la semana hasta el récord: al 100%, está en all time high.</footer>
</section>

<script>
  const $ = (id) => document.getElementById(id);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let heat = 0.6; // 0 a 1: qué tan cerca del ATH está; la altura de las llamas depende de esto
  let isAth = false; // en all time high se prende fuego todo el hero

  // --- Llamas: el algoritmo de fuego del DOOM, todo en rojos ---
  (function fire() {
    const canvas = $("fire"), ctx = canvas.getContext("2d");
    const W = 320, H = 200;
    canvas.width = W; canvas.height = H;
    const palette = [];
    const stops = [[10, 0, 0], [50, 1, 0], [100, 3, 0], [150, 6, 0], [195, 12, 2], [230, 22, 4], [255, 34, 6], [255, 52, 8], [255, 80, 10], [255, 120, 20], [255, 170, 50]];
    for (let i = 0; i < 37; i++) {
      const t = (i / 36) * (stops.length - 1), a = stops[Math.floor(t)], b = stops[Math.min(stops.length - 1, Math.ceil(t))], f = t % 1;
      palette.push(a.map((v, k) => Math.round(v + (b[k] - v) * f)));
    }
    const px = new Uint8Array(W * H);
    for (let x = 0; x < W; x++) px[(H - 1) * W + x] = 36;
    const img = ctx.createImageData(W, H);

    function step() {
      // Fuera del ATH la altura visible de las llamas es el devaluómetro medido
      // hasta el mensaje: al 100% llegan a la mitad de "No está en all time
      // high…". En el ATH pasan el borde de arriba y se prende fuego todo.
      // Un pixel se ve a partir de VISIBLE en la paleta, así que cada fila
      // enfría en promedio lo justo para bajar de 36 a VISIBLE en reach * H filas.
      const VISIBLE = 10;
      const hero = canvas.parentElement.getBoundingClientRect(), msg = $("message").getBoundingClientRect();
      const reach = isAth ? 1.2 : heat * (hero.bottom - (msg.top + msg.bottom) / 2) / hero.height;
      const cool = (36 - VISIBLE) / (H * Math.max(0.05, reach));
      for (let x = 0; x < W; x++) {
        for (let y = 1; y < H; y++) {
          const src = y * W + x, v = px[src];
          if (v === 0) { px[src - W] = 0; continue; }
          const r = Math.floor(Math.random() * 3.99);
          const dst = Math.max(W, Math.min(W * H - 1, src - r + 1));
          px[dst - W] = Math.max(0, v - Math.floor(cool + Math.random())); // resta `cool` en promedio
        }
      }
      for (let i = 0; i < px.length; i++) {
        const [r, g, b] = palette[px[i]];
        img.data[i * 4] = r; img.data[i * 4 + 1] = g; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = px[i] >= VISIBLE ? 255 : Math.round(255 * (px[i] / VISIBLE) ** 3); // la cola fría se desvanece en vez de dejar bruma
      }
      ctx.putImageData(img, 0, 0);
    }
    if (reduceMotion) { for (let i = 0; i < 80; i++) step(); return; }
    let last = 0;
    (function loop(t) {
      if (t - last > 33) { step(); last = t; } // ~30 cuadros por segundo
      requestAnimationFrame(loop);
    })(0);
  })();

  let lastPrice = null;
  USDT.start(({ current, ath, recent, message }) => {
    const price = $("price");
    price.textContent = USDT.formatArs(current.price);
    if (lastPrice != null && current.price > lastPrice && !reduceMotion) {
      price.classList.remove("shake"); void price.offsetWidth; price.classList.add("shake");
    }
    lastPrice = current.price;

    $("message").textContent = message.text;
    isAth = message.isAth;
    $("gap").textContent = message.isAth
      ? "Récord. Se prende fuego todo."
      : `Faltan ${USDT.formatArs(ath.price - current.price)} para el récord`;

    const low = Math.min(...recent.map((p) => p.close));
    heat = USDT.devaluometro(current.price, ath.price, recent);
    USDT.stayOnVersion("fuego", heat);
    $("meter").hidden = false;
    $("meter-value").textContent = `${Math.round(heat * 100)}%`;
    $("meter-fill").style.width = `${heat * 100}%`;
    $("meter-low").textContent = `Mínimo de la semana ${USDT.formatArs(low)}`;
    $("meter-high").textContent = `Récord ${USDT.formatArs(ath.price)}`;

    const chart = $("chart");
    const width = Math.max(320, chart.clientWidth);
    const opts = { width, height: width < 600 ? 240 : 300, ath: ath.price };
    chart.innerHTML = USDT.svgChart(recent, opts);
    USDT.attachHover(chart, recent, opts, (p) => `<b>${USDT.formatArs(p.close)}</b>${USDT.formatTime(p.time).slice(0, 16)}`);
    $("chart-sub").textContent = `cierres cada ${USDT.CHART_INTERVAL}, últimos ${USDT.CHART_DAYS} días`;

    $("ath").textContent = USDT.formatArs(ath.price);
    $("ath-date").textContent = USDT.formatDate(ath.time);
    $("updated").textContent = USDT.formatTime(current.time).slice(11);
  }, (exc) => {
    $("message").textContent = `No se pudo consultar la API de Binance (${exc.message}). Recargá la página para reintentar.`;
  });
</script>
</template>

<script src="usdt.js"></script>
<script>
  // Una sola URL: el navegador consulta Binance, calcula el devaluómetro y
  // monta la versión que corresponde (fuego por encima de FIRE_THRESHOLD,
  // moderna por debajo). Si falla la API, monta la moderna, que muestra el error.
  function mount(version) {
    const tpl = document.getElementById(`v-${version}`);
    const content = tpl.content.cloneNode(true);
    // Los <script> clonados de un template no se ejecutan: se recrean.
    const scripts = [...content.querySelectorAll("script")].map((old) => {
      old.remove();
      const script = document.createElement("script");
      script.textContent = old.textContent;
      return script;
    });
    document.getElementById("loading").remove();
    document.querySelectorAll("template").forEach((t) => t.remove());
    document.title = tpl.dataset.title;
    document.body.append(content, ...scripts);
  }

  (async () => {
    try {
      const [current, ath, recent] = await Promise.all([USDT.getCurrentPrice(), USDT.getHistoryAth(), USDT.getRecentCloses()]);
      mount(USDT.pickVersion(USDT.devaluometro(current.price, ath.price, recent)));
    } catch (exc) {
      mount("moderno");
    }
  })();
</script>
